<style>
/* ============ CSS Variables ============ */
:root {
  --green: #22c55e;
  --gold: #f59e0b;
}
:root[data-theme="light"] {
  --bg: #eef1f7;
  --surface: #ffffff;
  --surface-2: #f6f8fc;
  --surface-3: #eceff6;
  --border: #dfe4ee;
  --text: #1b2233;
  --text-2: #5c6880;
  --text-3: #8a94ab;
  --accent: #4f6ef7;
  --accent-soft: rgba(79,110,247,.12);
  --accent-2: #0e9aa8;
  --rec-bg: #ffe9ad;
  --rec-border: #e9b84e;
  --rec-soft: rgba(245,158,11,.30);
  --rec-text: #7a5200;
  --pri-bg: #ffd3cf;
  --pri-border: #e05b52;
  --pri-soft: rgba(239,68,68,.30);
  --pri-text: #8a1712;
  --done-bg: #e9edf2;
  --done-text: #98a2b3;
  --shadow: 0 1px 3px rgba(27,34,51,.06), 0 6px 24px rgba(27,34,51,.05);
  --topbar-bg: rgba(255,255,255,.92);
  --scroll-thumb: #c7cfdd;
}
:root[data-theme="dark"] {
  --bg: #0c1018;
  --surface: #151c2b;
  --surface-2: #1a2233;
  --surface-3: #222c42;
  --border: #28334d;
  --text: #e8ecf5;
  --text-2: #9aa7bf;
  --text-3: #6b7793;
  --accent: #7c93ff;
  --accent-soft: rgba(124,147,255,.16);
  --accent-2: #2dd4bf;
  --rec-bg: #3d3415;
  --rec-border: #b08c2a;
  --rec-soft: rgba(245,158,11,.35);
  --rec-text: #ffd977;
  --pri-bg: #4a2321;
  --pri-border: #c0554b;
  --pri-soft: rgba(239,68,68,.35);
  --pri-text: #ff9d94;
  --done-bg: #191e2a;
  --done-text: #5d6782;
  --shadow: 0 1px 3px rgba(0,0,0,.35), 0 8px 28px rgba(0,0,0,.3);
  --topbar-bg: rgba(12,16,24,.92);
  --scroll-thumb: #2c3855;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
  transition: background .3s ease, color .3s ease;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 999px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ Topbar (sticky) ============ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--topbar-bg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.topbar-inner { max-width: 1480px; margin: 0 auto; padding: 14px 20px 12px; }

.top-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-main { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.brand .collapse-btn { flex: none; }
.brand-logo {
  width: 42px; height: 42px; flex: none;
  border-radius: 12px;
  background: var(--surface-3);
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.brand-logo-img {
  width: 100%; height: 100%; object-fit: cover;
  display: block;
}
.brand h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; }
.brand .subtitle { font-size: 12px; color: var(--text-2); margin-top: 1px; }

.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tool-btn {
  appearance: none; cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  font-size: 13px; font-weight: 600;
  padding: 7px 13px; border-radius: 9px;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all .18s ease;
}
.tool-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tool-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.tool-btn.danger:hover { color: #ef4444; border-color: #ef4444; background: var(--pri-soft); }
.tool-btn .t-icon { font-size: 15px; line-height: 1; }

/* Overall progress */
.overall-wrap { margin-top: 12px; }
.overall-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.overall-label { font-size: 13px; font-weight: 700; color: var(--text-2); letter-spacing: .3px; }
.overall-stats { font-size: 13px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.overall-bar {
  height: 12px; border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden; position: relative;
  border: 1px solid var(--border);
}
.overall-fill {
  height: 100%; width: 0%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  transition: width .45s cubic-bezier(.2,.7,.3,1);
  position: relative;
}
.overall-fill::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.25), transparent 45%);
}

/* Controls: search + filter */
.controls { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.search-wrap { position: relative; flex: 1 1 260px; min-width: 200px; }
.search-wrap .s-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text-3); font-size: 15px; pointer-events: none;
}
#search {
  width: 100%;
  padding: 9px 14px 9px 36px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color .18s ease, box-shadow .18s ease;
}
#search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
#search::placeholder { color: var(--text-3); }
#priFilter {
  appearance: none;
  padding: 9px 34px 9px 14px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface) url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%238a94ab' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E") no-repeat right 13px center;
  color: var(--text-2);
  font-size: 14px; font-weight: 600;
  cursor: pointer; outline: none;
  transition: border-color .18s ease;
}
#priFilter:focus { border-color: var(--accent); }

/* Tabs */
.tabs { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 8px; margin-top: 12px; }
.tab-btn {
  appearance: none; cursor: pointer; text-align: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 8px 8px 9px;
  color: var(--text-2);
  transition: all .18s ease;
  display: flex; flex-direction: column; gap: 6px; align-items: stretch;
}
.tab-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.tab-btn.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
/* 搜索时该标签页有匹配结果的高亮 */
.tab-btn.has-match {
  border-color: var(--gold);
  background: var(--rec-soft);
}
.tab-btn.has-match .tab-label { color: var(--gold); }
.tab-label { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab-prog { height: 5px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.tab-prog-fill { display: block; height: 100%; width: 0%; border-radius: 999px; background: var(--accent); transition: width .4s ease; }
.tab-count { font-size: 11px; font-weight: 600; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ============ Main content ============ */
main { max-width: 1480px; margin: 0 auto; padding: 22px 20px 80px; }
.tabpanel { display: none; animation: fadeIn .25s ease; }
.tabpanel.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.panel-desc {
  font-size: 13px; color: var(--text-2);
  margin-bottom: 18px;
  padding: 10px 14px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 10px;
}

/* Group section */
.group-section { margin-bottom: 28px; }
.group-header {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 10px; padding: 0 2px;
}
.group-name {
  font-size: 16px; font-weight: 800; letter-spacing: .4px;
  display: flex; align-items: center; gap: 8px;
  color: var(--text);
  flex: none;
}
.group-avatar {
  width: 26px; height: 26px; flex: none;
  border-radius: 7px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px; color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
}
.group-count { font-size: 12px; font-weight: 700; color: var(--text-3); font-variant-numeric: tabular-nums; }
.group-bar { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.group-fill { display: block; height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s ease; }
.group-bar.gold .group-fill { background: linear-gradient(90deg, var(--gold), #fbbf24); }
/* 分栏收起按钮 */
.group-collapse {
  appearance: none; cursor: pointer;
  flex: none; width: 28px; height: 28px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; line-height: 1;
  transition: all .15s ease;
}
.group-collapse:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.group-section.group-closed .ach-grid { display: none; }
.group-section.group-closed .group-collapse .gc-ico { color: var(--accent); }

/* Card grid */
.ach-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
}

/* Achievement card */
.ach-card {
  position: relative;
  display: flex; align-items: flex-start; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 13px 14px 13px 13px;
  cursor: pointer;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .2s ease, opacity .2s ease;
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}
.ach-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
  border-color: var(--accent);
}
.ach-card.pri-recommend { background: var(--rec-bg); border-color: var(--rec-border); }
.ach-card.pri-recommend:hover { box-shadow: 0 0 0 3px var(--rec-soft); }
.ach-card.pri-recommend .ach-title a { color: var(--rec-text); }
.ach-card.pri-recommend .ach-title a:hover { color: var(--accent); }
.ach-card.pri-important { background: var(--pri-bg); border-color: var(--pri-border); }
.ach-card.pri-important:hover { box-shadow: 0 0 0 3px var(--pri-soft); }
.ach-card.pri-important .ach-title a { color: var(--pri-text); }
.ach-card.pri-important .ach-title a:hover { color: var(--accent); }

/* completed state */
.ach-card.done { background: var(--done-bg) !important; border-color: var(--border) !important; opacity: .55; }
.ach-card.done .ach-title-text { text-decoration: line-through; }
.ach-card.done .ach-title a { color: var(--done-text); }
.ach-card.done .ach-cond, .ach-card.done .ach-reward { color: var(--done-text); }
.ach-card.done .ach-icon img, .ach-card.done .icon-placeholder { filter: grayscale(.9); opacity: .6; }
.ach-card.done:hover { box-shadow: none; transform: none; }

/* icon wrap (holds badge outside overflow) */
.ach-icon-wrap { position: relative; flex: none; width: 58px; height: 58px; }
.ach-icon {
  position: absolute; inset: 0;
  border-radius: 11px;
  overflow: hidden;
  background: var(--surface-3);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  transition: filter .2s ease;
}
.ach-icon img { width: 100%; height: 100%; object-fit: cover; display: none; border-radius: 0; }
.ach-icon .atlas-icon { width: 100%; height: 100%; }
.ach-card.done .ach-icon .atlas-icon { filter: grayscale(.9); opacity: .6; }
.ach-icon.has-img img { display: block; }
.ach-icon.has-img .icon-placeholder { display: none; }
.icon-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,.25);
}
.icon-placeholder.grad-a { background: linear-gradient(140deg, #5b7cfa, #34d0ba); }
.icon-placeholder.grad-b { background: linear-gradient(140deg, #8b5cf6, #5b7cfa); }
.icon-placeholder.grad-c { background: linear-gradient(140deg, #f59e0b, #ef4444); }
.icon-placeholder.grad-d { background: linear-gradient(140deg, #10b981, #06b6d4); }
.icon-placeholder.grad-e { background: linear-gradient(140deg, #ec4899, #8b5cf6); }
.pri-badge {
  position: absolute; top: -7px; right: -7px; z-index: 3;
  font-size: 10.5px; font-weight: 800;
  padding: 3px 8px;
  border-radius: 999px;
  color: #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.4);
  letter-spacing: .5px;
  pointer-events: none;
  white-space: nowrap;
  border: 1.5px solid rgba(255,255,255,.55);
}
.pri-badge.b-rec { background: linear-gradient(135deg, #e28d00, #fbbf24); }
.pri-badge.b-pri { background: linear-gradient(135deg, #dc2626, #f87171); }

/* body */
.ach-body { flex: 1; min-width: 0; }
.ach-title { font-size: 15px; font-weight: 700; line-height: 1.35; margin-bottom: 3px; }
.ach-title a {
  color: var(--text);
  text-decoration: none;
  background-image: linear-gradient(transparent calc(100% - 2px), var(--accent) 2px);
  background-size: 0% 100%; background-repeat: no-repeat;
  transition: background-size .2s ease, color .15s ease;
}
.ach-title a:hover { color: var(--accent); background-size: 100% 100%; }
.ach-reward { font-size: 12.5px; color: var(--accent-2); font-weight: 600; margin-bottom: 2px; word-break: break-word; }
.ach-reward .no-reward { color: var(--text-3); font-weight: 500; }
.ach-cond { font-size: 12.5px; color: var(--text-2); word-break: break-word; }
.inline-link {
  color: var(--accent);
  text-decoration: underline dotted 1px;
  text-underline-offset: 3px;
  cursor: pointer;
}
.inline-link:hover { color: var(--accent-2); }

/* 成就完成进度条（计数器型成就） */
.ach-progress {
  margin-top: 6px;
  height: 6px;
  border-radius: 999px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  overflow: hidden;
  position: relative;
}
.ach-progress-fill {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #4f7cff, #34d0ba);
  transition: width .25s ease;
}
.ach-card.done .ach-progress-fill { background: linear-gradient(90deg, #22c55e, #10b981); }
.ach-progress-text {
  margin-top: 3px;
  font-size: 11px;
  color: var(--text-3);
  line-height: 1.2;
}

/* check */
.ach-side { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: none; margin-top: 3px; }
.ach-check {
  position: relative; flex: none;
  width: 26px; height: 26px;
  border-radius: 8px;
  border: 2px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  transition: all .18s ease;
  display: flex; align-items: center; justify-content: center;
}
.ach-card:hover .ach-check { border-color: var(--accent); }
.ach-check::after {
  content: "";
  width: 6px; height: 11px;
  border: solid #fff; border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg) scale(0);
  transition: transform .18s ease;
  margin-top: -2px;
}
.ach-card.done .ach-check { background: var(--accent); border-color: var(--accent); }
.ach-card.done .ach-check::after { transform: rotate(45deg) scale(1); }

/* 自定义优先级按钮 */
.pri-btn {
  appearance: none; cursor: pointer;
  width: 26px; height: 26px;
  border-radius: 8px;
  border: 2px solid var(--border);
  background: var(--surface);
  color: var(--text-3);
  font-size: 13px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: all .18s ease;
  position: relative;
}
.ach-card:hover .pri-btn { color: var(--text-2); border-color: var(--border); }
.pri-btn:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
.ach-card.pri-important .pri-btn { color: #fff; background: linear-gradient(135deg, #dc2626, #f87171); border-color: transparent; }
.ach-card.pri-recommend .pri-btn { color: #fff; background: linear-gradient(135deg, #e28d00, #fbbf24); border-color: transparent; }
.ach-card.done .pri-btn { opacity: .6; }

/* hidden (search filter) */
.ach-card.hidden, .group-section.hidden { display: none !important; }

.empty-state {
  text-align: center; padding: 48px 20px;
  color: var(--text-3);
  font-size: 14px;
  display: none;
}
.empty-state.show { display: block; }
.empty-state .e-icon { font-size: 40px; margin-bottom: 10px; }

/* Toast */
#toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-left: 4px solid var(--green);
  box-shadow: var(--shadow);
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 13.5px; font-weight: 600;
  opacity: 0; pointer-events: none;
  transition: all .3s ease;
  z-index: 999;
  max-width: 90vw;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* 优先级弹出菜单 */
.pri-menu {
  position: fixed; z-index: 1000;
  min-width: 150px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 6px;
  /* 不用动画：避免 opacity 动画卡在初始透明状态导致菜单不可见 */
}
.pri-menu-title {
  font-size: 11px; font-weight: 700; color: var(--text-3);
  padding: 4px 10px 6px; letter-spacing: .5px;
}
.pri-menu-item {
  appearance: none; cursor: pointer;
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 8px;
  background: none; border: none; border-radius: 8px;
  padding: 7px 10px;
  font-size: 13px; font-weight: 600; color: var(--text-2);
  transition: background .15s ease;
}
.pri-menu-item:hover { background: var(--surface-3); color: var(--text); }
.pri-menu-item.active { color: var(--text); }
.pri-menu-item .pm-dot {
  width: 10px; height: 10px; border-radius: 50%; flex: none;
  background: var(--border);
}
.pri-menu-item.opt-pri .pm-dot { background: linear-gradient(135deg, #ef4444, #f87171); }
.pri-menu-item.opt-rec .pm-dot { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
.pri-menu-item.opt-none .pm-dot { background: var(--text-3); }
.pri-menu-item .pm-hint { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--text-3); }
.pri-menu-item.opt-none .pm-hint { display: none; }

/* 优先级预设弹出面板 */
.preset-panel {
  position: fixed; z-index: 1100;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: min(92vw, 380px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
  /* 不用动画：避免 opacity/transform 动画在 hidden 切换时卡在初始状态 */
}
.preset-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 10px;
}
.preset-title { font-size: 15px; font-weight: 800; }
.preset-close {
  appearance: none; cursor: pointer;
  background: none; border: none;
  color: var(--text-3); font-size: 15px;
  width: 28px; height: 28px; border-radius: 8px;
  transition: all .15s ease;
}
.preset-close:hover { color: var(--text); background: var(--surface-3); }
.preset-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px; }
.preset-desc { font-size: 12px; color: var(--text-2); line-height: 1.5; margin-bottom: 4px; }
.preset-btn { width: 100%; justify-content: center; padding: 10px; font-size: 13px; }
/* 存档拖拽导入区 */
.save-dropzone {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 18px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  transition: border-color .18s ease, background .18s ease;
  cursor: pointer;
  text-align: center;
}
.save-dropzone:hover { border-color: var(--accent); }
.save-dropzone.dragover {
  border-color: var(--accent);
  background: var(--accent-soft, rgba(79,124,255,.08));
}
.save-dropzone .dz-icon { font-size: 22px; line-height: 1; }
.save-dropzone .dz-text { font-size: 12px; color: var(--text-2); line-height: 1.5; }
.save-dropzone .dz-hint { font-size: 11px; color: var(--text-3); line-height: 1.4; }

/* 导入状态 */
.steam-status { font-size: 12px; color: var(--text-2); min-height: 16px; line-height: 1.5; }
.steam-status.err { color: #ef4444; }
.steam-status.ok { color: #22c55e; }
.steam-status.loading { color: var(--accent); }
/* Steam 导入区 */
.steam-sep { display: flex; align-items: center; gap: 8px; color: var(--text-3); font-size: 12px; margin: 2px 0; }
.steam-sep::before, .steam-sep::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.steam-input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); color: var(--text); font-size: 12px; line-height: 1.5; outline: none; transition: border-color .15s ease; }
.steam-input:focus { border-color: var(--accent); }
.steam-hint { font-size: 11px; color: var(--text-3); line-height: 1.5; }
.steam-options { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.steam-options input { accent-color: var(--accent); width: 13px; height: 13px; }
.steam-remember { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 12px; color: var(--text-2); }
.steam-remember label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.steam-remember input { accent-color: var(--accent); width: 13px; height: 13px; }
.steam-remember-clear { appearance: none; border: none; background: none; cursor: pointer; color: var(--text-3); font-size: 11px; text-decoration: underline; padding: 0; transition: color .15s ease; }
.steam-remember-clear:hover { color: #ef4444; }
.preset-code-wrap { display: flex; flex-direction: column; gap: 8px; }
.preset-code-wrap textarea {
  width: 100%; resize: vertical; min-height: 64px;
  padding: 9px 11px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--surface-2);
  color: var(--text);
  font-size: 12px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  line-height: 1.5;
  outline: none;
  transition: border-color .15s ease;
}
.preset-code-wrap textarea:focus { border-color: var(--accent); }
.preset-code-wrap textarea::placeholder { color: var(--text-3); }
.preset-panel[hidden] { display: none; }
/* 背景遮罩 */
.preset-overlay {
  position: fixed; inset: 0; z-index: 1090;
  background: rgba(0,0,0,.45);
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Responsive */
@media (max-width: 980px) {
  .tabs { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .brand h1 { font-size: 17px; }
  .ach-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
}
@media (max-width: 560px) {
  .tabs { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .topbar-inner { padding: 10px 12px 10px; }
  main { padding: 14px 12px 60px; }
  .ach-grid { grid-template-columns: 1fr; gap: 10px; }
  /* 手机上成就卡片更紧凑 */
  .ach-card { padding: 11px 12px 11px 11px; border-radius: 11px; gap: 10px; }
  .ach-icon-wrap { width: 52px; height: 52px; }
  .ach-icon { border-radius: 10px; }
  .ach-title { font-size: 14px; }
  .ach-reward, .ach-cond { font-size: 12px; }
  .pri-badge { font-size: 9.5px; padding: 2px 6px; }
  /* 分组标题更紧凑 */
  .group-section { margin-bottom: 22px; }
  .group-header { margin-bottom: 8px; }
  .group-name { font-size: 15px; }
  .group-avatar { width: 24px; height: 24px; font-size: 12px; }
  /* 标签页按钮 */
  .tab-btn { padding: 6px 4px 7px; border-radius: 9px; gap: 4px; }
  .tab-label { font-size: 12px; }
  .tab-prog { height: 4px; }
  .tab-count { font-size: 10px; }
  .panel-desc { font-size: 12px; padding: 8px 12px; margin-bottom: 14px; }
  .toolbar .tool-btn #themeLabel { display: inline; }
  /* 搜索 + 筛选同行，隐藏已完成按钮 */
  .controls { gap: 8px; }
  .search-wrap { flex: 1 1 100%; min-width: 0; }
  #priFilter { flex: 1 1 0; padding: 9px 26px 9px 10px; }
  #hideDoneBtn { flex: 1 1 0; padding: 9px 8px; justify-content: center; font-size: 12px; }
}

/* 收起/展开按钮：仅手机端显示 */
.collapse-btn, .more-btn { display: none !important; }
@media (max-width: 760px) {
  .collapse-btn, .more-btn { display: inline-flex !important; }
}
.collapse-ico { transition: transform .25s ease; }
body.topbar-collapsed .collapse-ico { transform: rotate(180deg); }

/* 折叠时隐藏搜索/标签页区域，总进度条常驻（仅手机端生效） */
@media (max-width: 760px) {
  body.topbar-collapsed .controls,
  body.topbar-collapsed .tabs { display: none !important; }
  body.topbar-collapsed .topbar { box-shadow: none; }
  body.topbar-collapsed .topbar-inner { padding-bottom: 8px; }
  body.topbar-collapsed .brand .subtitle { display: none; }
  body.topbar-collapsed .overall-wrap { margin-top: 8px; }
}
/* 桌面端即使有 collapsed 标记也显示全部 */
@media (min-width: 761px) {
  body.topbar-collapsed .controls,
  body.topbar-collapsed .tabs { display: block !important; }
  body.topbar-collapsed .brand .subtitle { display: block; }
}

/* 手机端顶部紧凑布局 */
@media (max-width: 760px) {
  .top-row { flex-direction: column; align-items: stretch; gap: 10px; }

  /* 标题行：logo + 标题 + 操作按钮同一行 */
  .brand { justify-content: space-between; align-items: center; gap: 8px; }
  .brand-main { gap: 10px; }
  .brand .brand-logo { width: 36px; height: 36px; font-size: 18px; border-radius: 10px; }
  .brand h1 { font-size: 15px; white-space: normal; line-height: 1.25; }
  .brand .subtitle { font-size: 10.5px; white-space: normal; margin-top: 2px; }

  /* 标题行右侧操作按钮：菜单 ☰ + 收起 ▲，两个并排紧凑圆形 */
  .brand-actions {
    display: flex; align-items: center; gap: 6px;
    flex: none;
  }
  .brand-actions .tool-btn {
    width: 36px; height: 36px; padding: 0;
    justify-content: center;
    font-size: 14px;
    border-radius: 10px;
  }
  .brand .collapse-btn {
    width: 36px; height: 36px; padding: 0;
    flex: none;
    justify-content: center;
    font-size: 13px;
    border-radius: 10px;
  }

  /* 工具栏默认隐藏，作为"更多"下拉菜单内容 */
  .toolbar {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .toolbar.more-open { display: grid; }
  .toolbar .tool-btn {
    flex-direction: column;
    gap: 4px;
    padding: 10px 2px;
    font-size: 11px;
    border-radius: 10px;
    justify-content: center;
  }
  .toolbar .tool-btn .t-icon { font-size: 18px; line-height: 1; }
  .toolbar .tool-btn #themeLabel { font-size: 11px; }
  .more-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  .overall-wrap { margin-top: 10px; }
  .overall-head { margin-bottom: 4px; }
  .controls { margin-top: 10px; }
  .tabs { margin-top: 10px; }
  #priFilter { flex: 0 0 auto; padding: 9px 30px 9px 12px; }
  .search-wrap input { padding: 9px 12px 9px 34px; }
}

/* ============ 图鉴悬浮窗 ============ */
.codex-fab {
  position: fixed; right: 16px; bottom: 96px; z-index: 400;
  width: 58px; height: 58px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  box-shadow: 0 6px 20px rgba(0,0,0,.28);
  font-size: 13px; font-weight: 700; cursor: grab;
  touch-action: none; user-select: none;
}
.codex-fab:active { cursor: grabbing; }
.codex-overlay {
  position: fixed; inset: 0; z-index: 450; background: rgba(0,0,0,.45);
  display: none; align-items: stretch; justify-content: center;
}
.codex-overlay.open { display: flex; }
.codex-panel {
  background: var(--surface); color: var(--text);
  width: min(760px, 100%); height: 100%; display: flex; flex-direction: column;
  box-shadow: var(--shadow);
}
@media (min-width: 900px) {
  .codex-overlay { align-items: stretch; justify-content: flex-end; }
  .codex-panel { width: 460px; height: 100%; }
}
.codex-head { display: flex; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.codex-head input {
  flex: 1; min-width: 0; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
}
.codex-close { border: none; background: transparent; color: var(--text-2); font-size: 22px; cursor: pointer; }
.codex-tabs { display: flex; gap: 6px; padding: 10px 14px 0; overflow-x: auto; }
.codex-tab {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2);
  border-radius: 999px; padding: 5px 12px; font-size: 13px; white-space: nowrap; cursor: pointer;
}
.codex-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.codex-tools { display: flex; gap: 8px; padding: 8px 14px; flex-wrap: wrap; align-items: center; }
.codex-tools select {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  border-radius: 8px; padding: 5px 8px; font-size: 13px;
}
.codex-quality { display: flex; gap: 4px; }
.codex-quality button {
  width: 30px; height: 26px; border-radius: 7px; font-size: 12px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); cursor: pointer;
}
.codex-quality button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.codex-main { flex: 1; min-height: 0; display: flex; }
.codex-body { flex: 1; min-width: 0; overflow-y: auto; padding: 4px 10px 40px; position: relative; }
.codex-index {
  flex: none; width: 24px; overflow-y: auto; overflow-x: hidden;
  display: none; flex-direction: column; align-items: center; gap: 1px;
  padding: 6px 0; font-size: 10px; color: var(--text-3); user-select: none;
  background: var(--surface); border-left: 1px solid var(--border);
}
.codex-index.show { display: flex; }
.codex-index span { cursor: pointer; padding: 0 2px; line-height: 1.45; }
.codex-index span.active { color: var(--accent); font-weight: 700; }
.codex-group-h { position: sticky; top: 0; background: var(--surface); padding: 6px 6px 4px; font-weight: 700; font-size: 13px; color: var(--text-2); z-index: 2; }
.codex-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 6px; border-bottom: 1px solid var(--border);
  text-decoration: none; color: inherit; cursor: pointer;
}
.codex-item:hover { background: var(--surface-2); }
.codex-icon { flex: none; width: 46px; height: 46px; border-radius: 8px; background-color: var(--surface-3); background-repeat: no-repeat; }
.codex-icon.lg { width: 64px; height: 64px; }
.codex-meta { min-width: 0; }
.codex-name { font-size: 14px; font-weight: 600; }
.codex-sub { font-size: 12px; color: var(--text-3); }
.codex-q { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--surface-3); color: var(--text-2); margin-left: 6px; }
.codex-section-title { font-size: 12px; color: var(--text-3); padding: 8px 14px 2px; }
.codex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; padding: 6px 14px 20px; }
.codex-grid .codex-icon { width: 56px; height: 56px; cursor: pointer; }
.codex-detail { padding: 16px 18px; }
.codex-detail h3 { font-size: 17px; margin-bottom: 6px; }
.codex-detail p { font-size: 13px; color: var(--text-2); margin-bottom: 10px; white-space: pre-wrap; }
</style>

            <h1>以撒的结合成就完成清单</h1>

        </div>
        <div class="brand-actions">
          <button class="tool-btn more-btn" id="moreBtn" title="更多操作（主题/导出/导入/重置）"><span class="t-icon">☰</span></button>
          <button class="tool-btn collapse-btn" id="collapseBtn" title="收起 / 展开顶部面板"><span class="t-icon collapse-ico">▲</span></button>
        </div>
      </div>
      <div class="toolbar">
        <button class="tool-btn" id="themeBtn" title="切换主题：浅色 / 深色 / 自动(按本地时间)"><span class="t-icon">🌓</span><span id="themeLabel">主题</span></button>
        <button class="tool-btn" id="importAchBtn" title="从存档导入已完成成就"><span class="t-icon">🎮</span><span class="tb-text">导入成就</span></button>
        <button class="tool-btn" id="priPresetBtn" title="优先级预设：导出 / 导入"><span class="t-icon">🏷</span><span class="tb-text">优先级预设</span></button>
        <button class="tool-btn danger" id="resetBtn" title="重置所有完成进度"><span class="t-icon">🗑</span><span class="tb-text">重置</span></button>
        <button class="tool-btn" id="backToViewBtn" title="回到上次浏览位置" style="display:none"><span class="t-icon">↩</span><span class="tb-text">回到上次位置</span></button>
        <input type="file" id="saveImportFile" accept=".dat,.sav,application/octet-stream" hidden>
        <input type="file" id="priPresetFile" accept="application/json,.json" hidden>
      </div>
    </div>

    <div class="overall-wrap">
      <div class="overall-head">

<!-- 优先级预设弹出面板：body 直接子元素，避免受 topbar 层叠上下文影响 -->
<div class="preset-panel" id="presetPanel" hidden>
  <div class="preset-head">
    <span class="preset-title">🎯 优先级预设</span>
    <button class="preset-close" id="presetClose" title="关闭">✕</button>
  </div>
  <div class="preset-body">
    <p class="preset-desc">优先级是一串代码，每个人设置不同代码就不同。复制代码分享给社区，或粘贴别人的代码一键套用。</p>

    <button class="tool-btn preset-btn" id="presetExportBtn"><span class="t-icon">📤</span>生成我的优先级代码</button>

    <div class="preset-code-wrap">
      <textarea id="presetCode" rows="3" placeholder="粘贴优先级代码（ISAACPRI1-...）"></textarea>
      <button class="tool-btn preset-btn" id="presetImportCodeBtn"><span class="t-icon">📥</span>导入此代码</button>
    </div>

    <button class="tool-btn preset-btn danger" id="presetClearBtn"><span class="t-icon">🗑</span>清空我的优先级</button>
  </div>
</div>

<!-- 成就导入面板：body 直接子元素 -->
<div class="preset-panel" id="importAchPanel" hidden>
  <div class="preset-head">
    <span class="preset-title">🎮 导入已完成成就</span>
    <button class="preset-close" id="importAchClose" title="关闭">✕</button>
  </div>
  <div class="preset-body">
    <p class="preset-desc">导入存档后自动勾选已完成的成就，并显示计数器成就的完成进度。</p>
    <div class="save-dropzone" id="saveDropzone">
      <span class="dz-icon">📁</span>
      <span class="dz-text">点击选择存档文件，或将文件拖到这里</span>
      <span class="dz-hint">支持 rep_persistentgamedata1.dat 等 .dat 存档</span>
      <button class="tool-btn preset-btn" id="saveImportBtn" type="button"><span class="t-icon">📂</span>选择文件…</button>
    </div>
    <div class="steam-status" id="steamStatus"></div>

    <div class="steam-sep">或</div>

    <p class="preset-desc">从 Steam 拉取你的成就进度（需要 Steam 个人资料的“游戏详情”公开）。</p>
    <input class="steam-input" id="steamInput" type="text" placeholder="粘贴 Steam 资料链接或 17 位数字 ID，如 https://steamcommunity.com/profiles/76561198000000000">
    <div class="steam-options">
      <label><input type="checkbox" id="steamMerge" checked> 保留当前已勾选的成就（合并导入）</label>
    </div>
    <div class="steam-remember">
      <label><input type="checkbox" id="steamRemember"> 记住我的 Steam 账号</label>
      <button type="button" class="steam-remember-clear" id="steamRememberClear">清除记忆</button>
    </div>
    <p class="steam-hint">勾选「记住」后，下次打开面板会自动填入，无需重复输入。</p>
    <button class="tool-btn preset-btn" id="steamImportBtn"><span class="t-icon">☁</span>从 Steam 导入</button>
  </div>
</div>

<script id="search-core">
function isSubsequence(q, text) {
  let i = 0;
  for (const ch of text) {
    if (ch === q[i]) i++;
    if (i === q.length) return true;
  }
  return q.length === 0;
}

function editDistance(a, b) {
  if (Math.abs(a.length - b.length) > 1) return 2;
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

function isAscii(s) { return /^[\x00-\x7f]+$/.test(s); }

function buildSearchIndex(items, aliases) {
  const byTarget = new Map();
  for (const [alias, list] of Object.entries(aliases || {})) {
    for (const { kind, id } of list) {
      const key = kind + ':' + id;
      if (!byTarget.has(key)) byTarget.set(key, []);
      byTarget.get(key).push(alias);
    }
  }
  return items.map(it => {
    const aliasList = byTarget.get(it.kind.replace(/s$/, '') + ':' + it.id) || [];
    return Object.assign({}, it, {
      _name: String(it.name || '').toLowerCase(),
      _en: String(it.en || '').toLowerCase(),
      _py: String(it.py || '').toLowerCase(),
      _alias: aliasList,
    });
  });
}

function searchExact(index, q) {
  const s = String(q || '').trim().toLowerCase();
  if (!s) return [];
  return index.filter(it =>
    it._name.includes(s) ||
    (it._en && it._en.includes(s)) ||
    String(it.id) === s
  );
}

function searchFuzzy(index, q, excludeKeys = new Set()) {
  const s = String(q || '').trim().toLowerCase();
  if (!s) return [];
  const hits = [];
  for (const it of index) {
    if (excludeKeys.has((it.kind || '') + ':' + it.id)) continue;
    let hit = false;
    if (it._alias.some(a => a.toLowerCase() === s)) hit = true;
    if (!hit && s.length >= 2 && isSubsequence(s, it._name)) hit = true;
    if (!hit && s.length >= 2 && it._py && isSubsequence(s, it._py)) hit = true;
    if (!hit && it._py && it._py.startsWith(s)) hit = true;
    if (!hit && it.ini && it.ini.startsWith(s)) hit = true;
    if (!hit && isAscii(s) && it._py && editDistance(s, it._py) <= 1) hit = true;
    if (hit) hits.push(it);
  }
  return hits;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function restoreView(state) {

  }

function autoLink(text) {
  let out = '';
  // 支持英文引号 "..." 和中文引号 “...”，各自成对匹配
  const re = /"([^"]+)"|“([^”]+)”/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    out += esc(text.slice(last, m.index));
    const name = m[1] !== undefined ? m[1] : m[2];
    out += '<a class="inline-link" href="' + wikiUrl(name) + '" data-wiki="1" rel="noopener">&ldquo;' + esc(name) + '&rdquo;</a>';
    last = m.index + m[0].length;
  }
  out += esc(text.slice(last));
  return out;
}
function gradClass(id) { return 'grad-' + String.fromCharCode(97 + (id % 5)); }

// 解锁挑战成就的条件链接：把"解锁XXX和YYY"里的道具名都加 wiki 超链接
function linkChallengeCond(text) {
  const s = String(text || '');
  // 找到"解锁"（可带"道具"）后的名词列表，到 并/。 结束
  const m = s.match(/解锁(道具)?([^。]*?)(?:。|并|$)/);
  if (!m) return autoLink(s);   // 没有"解锁"则回退到常规处理
  const prefix = '解锁' + (m[1] || '');   // "解锁" 或 "解锁道具"
  const listStr = m[2];
  // 余下部分：若以"并"结尾则保留"并"+后续，否则就是结束标点
  let tail = '';
  const consumed = m[0];
  if (consumed.endsWith('并')) {
    tail = '并' + s.slice(m.index + m[0].length);
  } else {
    tail = s.slice(m.index + m[0].length);
  }
  // 按 和/、 分隔（保留分隔符），给每个名词加链接
  const parts = listStr.split(/([、和])/);
  let out = esc(prefix);
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (i % 2 === 0) {
      const t = p.trim();
      if (t && t.length >= 2) {
        out += '<a class="inline-link" href="' + wikiUrl(t) + '" data-wiki="1" rel="noopener">' + esc(t) + '</a>';
      } else {
        out += esc(p);
      }
    } else {
      out += esc(p);   // 分隔符
    }
  }
  out += esc(tail);
  return out;
}

// 从解锁条件或奖励链接中提取挑战编号，用于挑战排序（返回 null 表示无编号）
function challengeNum(item) {
  const m = String(item.cond || '').match(/挑战#(\d+)/);
  if (m) return +m[1];
  // wlink 形如 /wiki/%E6%8C%91%E6%88%98/4（挑战的 URL 编码）或 /wiki/挑战/4
  const m2 = String(item.wlink || '').match(/\%E6\%8C\%91\%E6\%88\%98\/(\d+)/);
  if (m2) return +m2[1];
  const m3 = String(item.wlink || '').match(/挑战\/(\d+)/);
  return m3 ? +m3[1] : null;
}

// 成就标题链接：优先奖励页面，其次成就页面
function titleHref(item) {

    return 'https://isaac.huijiwiki.com' + item.wlink;

}

/* ---------- 外置图集裁剪 ---------- */
function assetUrl(file) {
  return '/assets/' + file + '?v=' + ASSETS.version;
}
function iconStyle(sheetName, cell) {
  const sheet = ASSETS[sheetName];
  if (!sheet) return '';
  const col = cell % sheet.cols;
  const row = Math.floor(cell / sheet.cols);
  const px = sheet.cols > 1 ? (col / (sheet.cols - 1)) * 100 : 0;
  const py = sheet.rows > 1 ? (row / (sheet.rows - 1)) * 100 : 0;
  return 'background-image:url(' + assetUrl(sheet.file) + ');' +
    'background-size:' + (sheet.cols * 100) + '% ' + (sheet.rows * 100) + '%;' +
    'background-position:' + px + '% ' + py + '%;' +
    'background-repeat:no-repeat;';
}
function cellOf(pos, size, cols) {
  return (Math.abs(pos[1]) / size) * cols + Math.abs(pos[0]) / size;
}
function clampCell(sheetName, cell) {
  const sheet = ASSETS[sheetName];
  if (!sheet) return null;
  const max = sheet.cols * sheet.rows - 1;
  return Number.isInteger(cell) && cell >= 0 && cell <= max ? cell : null;
}
function wiconCell(item) {
  const type = item.wicon, id = item.wicon_id;
  if (!type || id === undefined || id === null || id === '') return null;
  const n = Number(id);
  if (!Number.isFinite(n)) return null;
  if (type === 'collectibles') {
    const pos = IPOS.collectibles[String(n).padStart(3, '0')];
    if (!pos) return null;
    const c = clampCell('item-collect', cellOf(pos, 32, 20));
    return c === null ? null : { sheet: 'item-collect', cell: c };
  }
  if (type === 'trinket') {
    const pos = IPOS.trinkets[String(n).padStart(3, '0')];
    if (!pos) return null;
    const c = clampCell('item-trinket', cellOf(pos, 32, 20));
    return c === null ? null : { sheet: 'item-trinket', cell: c };
  }
  if (type === 'cards') {
    if (n >= 32 && n <= 39) {
      const c = clampCell('item-runes', n - 32);
      return c === null ? null : { sheet: 'item-runes', cell: c };
    }
    // item-cards.webp 按 id 1–97 顺序铺格（32–39 保留空格），格号 = id-1
    const c = clampCell('item-cards', n - 1);
    return c === null ? null : { sheet: 'item-cards', cell: c };
  }
  if (type === 'pills') {
    const c = clampCell('item-pills', n);
    return c === null ? null : { sheet: 'item-pills', cell: c };
  }
  return null;
}
function wiconStyle(item) {
  const c = wiconCell(item);
  return c ? iconStyle(c.sheet, c.cell) : '';
}

function generateWikiIcons() {
  // 堕化角色头像仍用内嵌 base64（体积小）
  const charNameToIdx = ['堕化以撒','堕化抹大拉','堕化该隐','堕化犹大','堕化???','堕化夏娃','堕化参孙','堕化阿撒泻勒','堕化拉撒路','堕化伊甸','堕化游魂','堕化莉莉丝','堕化店主','堕化亚玻伦','堕化遗骸','堕化伯大尼','堕化雅各'];
  const nameIdx = {};
  charNameToIdx.forEach((n, i) => nameIdx[n] = i);
  for (const [id, cname] of Object.entries(TAINTED_MAP)) {

    if (idx === undefined || !TAINTED_CHARS[idx]) continue;

/* ---------- 分组 ---------- */
// 按优先级排序：优先 > 推荐 > 无；同优先级按名称首字母（localeCompare 按拼音）
function priSort(a, b) {
  const pa = effectivePri(a), pb = effectivePri(b);
  const rank = { '优先': 0, '推荐': 1 };
  const ra = rank[pa] !== undefined ? rank[pa] : 2;
  const rb = rank[pb] !== undefined ? rank[pb] : 2;
  if (ra !== rb) return ra - rb;
  // 同优先级按名称排序（中文按拼音，英文/数字排后）
  return String(a.title).localeCompare(String(b.title), 'zh');
}

function buildGroups(tab) {
  const groups = [];
  if (tab.mode === 'char') {
    const order = tab.id === 'normal' ? NORMAL_ORDER : TAINTED_ORDER;
    for (const gname of order) {
      const items = DATA.filter(i => i.type === tab.types[0] && (i.char || '') === gname);
      if (items.length) groups.push([gname, items.slice().sort(priSort)]);
    }
    // 兜底：任何未在顺序表中的组
    const listed = new Set(groups.map(g => g[0]));
    const rest = DATA.filter(i => i.type === tab.types[0] && !listed.has(i.char));
    if (rest.length) groups.push(['未分组', rest.slice().sort(priSort)]);
  } else if (tab.mode === 'subtype') {
    for (const sub of tab.types) {
      let items = DATA.filter(i => i.type === sub);
      // 挑战类按挑战序号排序（无序号排最后）
      if (tab.id === 'challenge') {
        items = items.slice().sort((a, b) => {
          const na = challengeNum(a), nb = challengeNum(b);
          if (na === null && nb === null) return +a.id - +b.id;
          if (na === null) return 1;
          if (nb === null) return -1;
          return na - nb;
        });
      } else {
        // 非挑战标签页：按优先级 + 名称排序
        items = items.slice().sort(priSort);
      }
      if (items.length) groups.push([sub, items]);
    }
  } else {
    // 不分栏标签页也按优先级 + 名称排序
    const items = DATA.filter(i => i.type === tab.types[0]);
    groups.push([null, items.slice().sort(priSort)]);
  }
  return groups;
}

function effectivePri(item) {
  // 用户自定义优先级优先于表格默认

function progressHtml(id) {
  const p = state.progress && state.progress[String(id)];
  if (!p || !p.target) return '';
  const done = p.cur >= p.target;
  const shownCur = Math.min(p.cur, p.target);
  const pct = done ? 100 : Math.round(shownCur / p.target * 100);
  const label = done
    ? '已达成'
    : shownCur + ' / ' + p.target + '（' + pct + '%）';
  return '<div class="ach-progress"><div class="ach-progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="ach-progress-text">' + label + '</div>';
}

function cardHtml(item) {
  const pri = effectivePri(item);
  const priCls = pri === '优先' ? 'pri-important' : (pri === '推荐' ? 'pri-recommend' : '');
  const badge = pri === '优先' ? '<span class="pri-badge b-pri">优先</span>'
    : (pri === '推荐' ? '<span class="pri-badge b-rec">推荐</span>' : '');
  // 图标优先级：自定义上传 > 堕化角色头像 > 奖励道具图标 > 成就图标 > 首字占位
  let img, hasImg = false;
  if (state.icons[item.id]) {
    img = '<img src="' + state.icons[item.id] + '" alt="">';
    hasImg = true;
  } else if (state.charIcons[item.id]) {
    img = '<img src="' + state.charIcons[item.id] + '" alt="">';
    hasImg = true;
  } else if (wiconCell(item)) {
    img = '<div class="atlas-icon" style="' + wiconStyle(item) + '"></div>';
    hasImg = true;
  } else if (POS[item.id]) {
    img = '<div class="atlas-icon" style="' + iconStyle('atlas-ach', cellOf(POS[item.id], 64, 20)) + '"></div>';
    hasImg = true;
  } else {
    img = '<div class="icon-placeholder ' + gradClass(+item.id) + '">' + esc(item.title.slice(0,1)) + '</div>';
  }
  const reward = item.reward === '无奖励'
    ? '<span class="no-reward">无奖励</span>'
    : autoLink(item.reward);
  return '<div class="ach-card ' + priCls + '" data-id="' + item.id + '">' +
    '<div class="ach-icon-wrap">' +
      '<div class="ach-icon' + (hasImg ? ' has-img' : '') + '">' +
        img +
      '</div>' +
      badge +
    '</div>' +
    '<div class="ach-body">' +
      '<div class="ach-title"><a class="ach-title-text" href="' + titleHref(item) + '" data-wiki="1" rel="noopener">' + esc(item.title) + '</a></div>' +
      '<div class="ach-reward">奖励：' + reward + '</div>' +
      '<div class="ach-cond">' + (item.type === '解锁挑战' ? linkChallengeCond(item.cond) : autoLink(item.cond)) + '</div>' +
      progressHtml(item.id) +
    '</div>' +
    '<div class="ach-side">' +
      '<button class="pri-btn" data-pri-btn title="自定义优先级" aria-label="设置优先级">⚑</button>' +
      '<button class="ach-check" aria-label="标记完成"></button>' +
    '</div>' +
  '</div>';
}

/* ---------- 进度 ---------- */
function updateProgress() {
  const totalAll = DATA.length;
  const doneAll = state.completed.size;
  const pct = totalAll ? Math.round(doneAll / totalAll * 100) : 0;
  document.getElementById('overallStats').textContent = doneAll + ' / ' + totalAll + '（' + pct + '%）';
  document.getElementById('overallFill').style.width = pct + '%';

  for (const tab of TAB_DEFS) {
    const items = DATA.filter(i => tab.types.includes(i.type));
    const total = items.length;
    const done = items.filter(i => state.completed.has(String(i.id))).length;
    const fill = document.getElementById('tp-' + tab.id);
    const cnt = document.getElementById('tc-' + tab.id);
    if (fill) fill.style.width = (total ? done / total * 100 : 0) + '%';
    if (cnt) cnt.textContent = done + ' / ' + total;
  }

  document.querySelectorAll('.group-section').forEach(sec => {

    const ids = Array.from(grid.querySelectorAll('.ach-card')).map(c => c.dataset.id);

      fill.style.width = (done / total * 100) + '%';
      sec.querySelector('.group-bar').classList.toggle('gold', done === total);
    }
  });

/* ---------- 持久化 ---------- */
function save() {
  const payload = {
    completed: Array.from(state.completed).map(Number).sort((a, b) => a - b),
    icons: state.icons,
    userPri: state.userPri,
    progress: state.progress,
  };
  try { localStorage.setItem(STORE_KEY, JSON.stringify(payload)); }
  catch (e) { console.warn('save failed', e); }
}
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const p = JSON.parse(raw);
    if (Array.isArray(p.completed)) p.completed.forEach(id => state.completed.add(String(id)));
    if (p.icons && typeof p.icons === 'object') Object.assign(state.icons, p.icons);
    if (p.userPri && typeof p.userPri === 'object') {
      for (const [id, v] of Object.entries(p.userPri)) {
        if (v === '优先' || v === '推荐') state.userPri[id] = v;
      }
    }
    if (p.progress && typeof p.progress === 'object') state.progress = p.progress;
  } catch (e) { console.warn('load failed', e); }
}

const searchEl = document.getElementById('search');
const priEl = document.getElementById('priFilter');
let hideDone = false;   // 是否隐藏已完成的成就

// 模糊搜索评分：返回 0（不匹配）或 >0（匹配度得分）
// 允许 query 中有 1~2 个字符缺失（错别字/多余字容错），按序匹配 text 中的字符
function applyFilter(opts) {
  const q = searchEl.value.trim().toLowerCase();
  const pri = priEl.value;
  // 自动跳转仅在搜索输入等筛选事件时发生；用户主动点击标签页时不再被拉回去
  const allowJump = !opts || opts.jump !== false;

  // 在 DATA 上计算每个标签页的可见 ID（与面板是否已渲染无关）
  const byTab = {};
  for (const tab of TAB_DEFS) {
    const ids = new Set();
    for (const item of DATA) {
      if (!tab.types.includes(item.type)) continue;
      if (q) {
        const hay = (item.title + ' ' + item.reward + ' ' + item.cond + ' ' + (item.char || '')).toLowerCase();
        if (!hay.includes(q)) continue;
      }
      if (pri) {
        const p = effectivePri(item);
        if (pri === 'none' ? p !== '' : p !== pri) continue;
      }
      if (hideDone && state.completed.has(String(item.id))) continue;
      ids.add(String(item.id));
    }
    byTab[tab.id] = ids;
  }

  // 搜索时自动跳转到第一个有匹配结果的标签页（目标不是当前页才跳，避免重复渲染）
  if (allowJump && q) {
    const first = TAB_DEFS.find(t => byTab[t.id].size);
    if (first && first.id !== currentTab) {
      currentTab = first.id;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
      ensureActivePanel();
    }
  }

  document.querySelectorAll('.tabpanel').forEach(panel => {
    const ids = byTab[panel.id.replace('panel-', '')] || new Set();
    let panelHas = false;
    panel.querySelectorAll('.group-section').forEach(sec => {
      let groupHas = false;
      sec.querySelectorAll('.ach-card').forEach(card => {
        const on = ids.has(card.dataset.id);
        card.classList.toggle('hidden', !on);
        if (on) groupHas = true;
      });
      sec.classList.toggle('hidden', !groupHas);
      if (groupHas) panelHas = true;
    });
    const empty = panel.querySelector('.empty-state');
    if (empty) empty.classList.toggle('show', !panelHas);
  });

  document.querySelectorAll('.tab-btn').forEach(b => {
    const ids = byTab[b.dataset.tab];
    b.classList.toggle('has-match', !!q && !!ids && ids.size > 0);
  });
}

const presetPanel = document.getElementById('presetPanel');
let presetOverlayEl = null;
const PRESET_CODE_PREFIX = 'ISAACPRI1-';

// 生成优先级代码：base64url(JSON{id:优先级})，带前缀标识
function encodePresetCode() {
  const obj = {};
  for (const [id, v] of Object.entries(state.userPri)) {
    obj[String(id)] = v;
  }
  const json = JSON.stringify(obj);
  let b64 = btoa(unescape(encodeURIComponent(json)));
  b64 = b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); // base64url
  return PRESET_CODE_PREFIX + b64;
}
// 解码优先级代码
function decodePresetCode(code) {
  const c = String(code || '').trim();
  if (!c.startsWith(PRESET_CODE_PREFIX)) throw new Error('不是有效的优先级代码');
  let b64 = c.slice(PRESET_CODE_PREFIX.length);
  b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const json = decodeURIComponent(escape(atob(b64)));
  const obj = JSON.parse(json);
  if (typeof obj !== 'object' || obj === null) throw new Error('代码内容无效');
  return obj;
}

/* ---------- 游戏存档导入（提取已完成的成就） ---------- */
// 以撒的结合 存档格式（persistentgamedata2.dat / rep+persistentgamedata2.dat）：
//   0x00 文件头签名 "ISAACNGSAVE09R"（16字节）
//   0x18 成就数组计数 N（uint32 LE）
//   0x20 起 N 个字节的成就标志数组，每字节 0/1 表示成就 ID（从1开始）是否完成
function parseIsaacSave(buf) {
  const dv = new DataView(buf);
  if (buf.byteLength < 0x20 + 4) throw new Error('文件太小，不是有效的存档');
  // 校验文件头签名
  let sig = '';
  for (let i = 0; i < 16; i++) sig += String.fromCharCode(dv.getUint8(i));
  if (!sig.startsWith('ISAACNGSAVE')) throw new Error('不是以撒的结合存档文件');
  const count = dv.getUint32(0x18, true);   // 小端
  if (count < 100 || count > 2000) throw new Error('存档成就数量异常（' + count + '）');
  if (0x20 + count > buf.byteLength) throw new Error('存档文件不完整');
  const flags = [];
  for (let i = 0; i < count; i++) {
    const b = dv.getUint8(0x20 + i);
    if (b === 1) flags.push(i);            // i 即成就 ID（索引0 对应成就0，实际成就从1开始）
  }
  const unlocked = flags.filter(id => id >= 1);  // 过滤掉不存在的成就0

  // 读取计数器进度（Section1 数据区基址固定为 0x2B2，已用真实存档验证）
  const SEC1_BASE = 0x2B2;
  const progress = {};
  for (const [idStr, info] of Object.entries(COUNTER_MAP)) {
    const id = Number(idStr);
    const cur = dv.getUint32(SEC1_BASE + info.rel, true);
    progress[id] = { cur: cur, target: info.target, label: info.label };
  }
  return { unlocked: unlocked, progress: progress };
}

    panel.addEventListener('dragover', (e) => { e.preventDefault(); e.stopPropagation(); });
    panel.addEventListener('drop', (e) => { e.preventDefault(); e.stopPropagation(); });
  }
  // 全局拦截，防止拖到面板外时浏览器跳转
  ['dragover', 'drop'].forEach(evt => {
    document.addEventListener(evt, (e) => { e.preventDefault(); });
  });
})();

function importSaveData(buf, sourceName) {
  const parsed = parseIsaacSave(buf);
  const unlocked = parsed.unlocked;
  if (!unlocked.length) throw new Error('存档中未解析到已完成的成就');
  const dataIds = new Set(DATA.map(d => String(d.id)));
  let added = 0;
  unlocked.forEach(id => {
    const sid = String(id);
    if (!dataIds.has(sid)) return;
    if (!state.completed.has(sid)) { state.completed.add(sid); added++; }
  });
  // 保存计数器进度（仅限映射中存在的计数器型成就）
  state.progress = {};
  for (const [idStr, p] of Object.entries(parsed.progress)) {
    if (dataIds.has(idStr)) state.progress[idStr] = p;
  }
  renderAll();
  renderTabs();
  updateDoneClasses();
  updateProgress();
  applyFilter();
  save();
  return added;
}

/* ---------- Steam 成就导入（通过 Cloudflare Worker 代理） ---------- */
const STEAM_PROXY_KEY = 'isaac_steam_proxy';
// 代理地址自动推导（零配置，所有人直接用）：
// 1) 网页通过 http(s) 打开（部署到 Pages / 任何静态托管）时，自动使用「当前域名」作为代理地址。
//    要求网页和 /api/steam 部署在同一域名下（见 steam-proxy-pages/README.md 的「部署网页」一节）。
// 2) 本地双击打开（file://）时，回退到下面的硬编码地址。
// 3) 高级用法：可用 localStorage 的 isaac_steam_proxy 覆盖（便于测试不同部署）。
const STEAM_PROXY_URL = 'https://isaac-achievement.19x19.top';   // 仅本地 file:// 打开时使用（部署后可改为你的实际域名）

function getSteamProxy() {
  // ① 用户自定义地址（忽略已失效的 workers.dev）
  const saved = (localStorage.getItem(STEAM_PROXY_KEY) || '').trim();
  if (saved && !saved.includes('.workers.dev')) return saved;
  // ② http/https 打开：自动用当前域名（网页与代理同源部署）
  if (/^https?:$/.test(location.protocol)) return location.origin;
  // ③ file:// 本地打开：回退到硬编码地址
  return STEAM_PROXY_URL.trim();
}
const STEAM_REMEMBER_KEY = 'isaac_steam_remember';

// 记住的 Steam 账号：写入 / 读取 / 清除
function saveRememberedSteam(val) {
  try {
    if (val) localStorage.setItem(STEAM_REMEMBER_KEY, val);
    else localStorage.removeItem(STEAM_REMEMBER_KEY);
  } catch (e) { console.warn('saveRememberedSteam failed', e); }
}
function loadRememberedSteam() {
  try { return (localStorage.getItem(STEAM_REMEMBER_KEY) || '').trim(); }
  catch (e) { return ''; }
}
function clearRememberedSteam() {
  saveRememberedSteam('');
  const remEl = document.getElementById('steamRemember');
  if (remEl) remEl.checked = false;
  const inputEl = document.getElementById('steamInput');
  if (inputEl) inputEl.value = '';
}
// 打开导入面板时：若之前勾选过「记住」，自动填回账号
function applyRememberedSteam() {
  const remembered = loadRememberedSteam();
  if (!remembered) return;
  const inputEl = document.getElementById('steamInput');
  if (inputEl) inputEl.value = remembered;
  const remEl = document.getElementById('steamRemember');
  if (remEl) remEl.checked = true;
}
function steamParseInput(raw) {
  const s = String(raw || '').trim();
  if (!s) return null;
  if (/^7656\d{13}$/.test(s)) return s;
  let m = s.match(/steamcommunity\.com\/profiles\/(\d{17})/i);
  if (m) return m[1];
  m = s.match(/(7656119\d{10})/);
  if (m) return m[1];
  m = s.match(/steamcommunity\.com\/id\/([A-Za-z0-9_-]+)/i);
  if (m) return m[1];
  // 传统 STEAM_0:x:y / SteamID3 [U:1:n] / 纯数字短 ID：直接放行，交给后端解析
  if (/^STEAM_[0-5]:[01]:\d+$/i.test(s)) return s;
  if (/^\[U:1:\d+\]$/i.test(s)) return s;
  if (/^\d{1,10}$/.test(s)) return s;
  if (/^[A-Za-z0-9_-]{2,32}$/.test(s)) return s;
  return null;
}

async function importFromSteam() {
  const inputEl = document.getElementById('steamInput');
  const mergeEl = document.getElementById('steamMerge');
  if (!inputEl) return;
  const raw = inputEl.value.trim();
  if (!raw) { setSteamStatus('请先粘贴 Steam 资料链接或 ID', 'err'); return; }

  const proxy = getSteamProxy();
  if (!proxy || proxy.includes('YOUR-WORKER') || proxy.includes('YOUR-PAGES')) {
    setSteamStatus('尚未配置 Steam 代理地址。将网页部署到 Cloudflare Pages 后即可直接使用（详见 README），或控制台执行 localStorage.setItem("isaac_steam_proxy", "你的代理地址") 后刷新。', 'err');
    return;
  }

  const q = steamParseInput(raw);
  if (!q) { setSteamStatus('无法识别输入的链接 / ID，请检查后重试', 'err'); return; }

  const btn = document.getElementById('steamImportBtn');
  if (btn) btn.disabled = true;
  setSteamStatus('正在连接 Steam…', 'loading');
  try {
    const resp = await fetch(proxy + '/api/steam?q=' + encodeURIComponent(raw), {
      headers: { 'Accept': 'application/json' },
    });
    let data = null;
    try { data = await resp.json(); } catch (e) { /* 非 JSON */ }
    if (!resp.ok) {
      throw new Error((data && data.error) || ('请求失败（HTTP ' + resp.status + '），请确认 Worker 地址是否正确'));
    }
    if (!data || !data.ok || !Array.isArray(data.unlocked)) {
      throw new Error((data && data.error) || 'Worker 返回的数据格式异常');
    }

    // 合并模式：把当前已勾选 + Steam 解锁并集
    const keepExisting = !mergeEl || mergeEl.checked;
    if (!keepExisting) state.completed.clear();

    let added = 0, skipped = 0;
    const dataIds = new Set(DATA.map(d => String(d.id)));
    for (const name of data.unlocked) {
      const sid = String(name);
      if (!dataIds.has(sid)) { skipped++; continue; }   // 网页未收录的成就（如 Steam 638-641）
      if (!state.completed.has(sid)) { state.completed.add(sid); added++; }
    }

    renderAll();
    renderTabs();
    updateDoneClasses();
    updateProgress();
    applyFilter();
    save();

    const extras = skipped ? '（另有 ' + skipped + ' 个 Steam 成就本清单未收录，已忽略）' : '';
    setSteamStatus('Steam 导入完成：新增 ' + added + ' 个成就' + extras, 'ok');
    toast('Steam 导入完成：新增 ' + added + ' 个成就');
    // 「记住我的 Steam 账号」：勾选了则记忆，否则清除已有记忆
    const rememberEl = document.getElementById('steamRemember');
    if (rememberEl && rememberEl.checked) saveRememberedSteam(raw);
    else saveRememberedSteam('');
    inputEl.value = '';
  } catch (err) {
    setSteamStatus('Steam 导入失败：' + err.message, 'err');
  } finally {
    if (btn) btn.disabled = false;
  }
}

const steamImportBtn = document.getElementById('steamImportBtn');
if (steamImportBtn) steamImportBtn.addEventListener('click', importFromSteam);

/* ---------- 道具图鉴 ---------- */
// buildSearchIndex / searchExact / searchFuzzy 来自主脚本之前的 search-core 块
// （scripts/patch-html.mjs 从 scripts/lib/search.mjs 内联，与 Node 测试共用同一份算法）。
const CODEX = {
  loaded: false,
  loading: null,
  items: [],
  aliases: {},
  index: [],
  byId: null,
  kind: 'collectible',
  sort: 'letter',
  quality: '',
  query: '',
  scrollTop: 0,
  listScroll: 0,
  detail: false,
};
const CODEX_TABS = [
  { id: 'collectible', label: '道具' },
  { id: 'trinket', label: '饰品' },
  { id: 'pill', label: '胶囊' },
  { id: 'card', label: '卡牌·符文' },
];

function codexIsOpen() {
  const el = document.getElementById('codexOverlay');
  return !!(el && el.classList.contains('open'));
}

function codexLoad() {
  if (CODEX.loaded) return Promise.resolve();
  if (!CODEX.loading) {
    CODEX.loading = fetch('/data/codex.json')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => {
        CODEX.items = data.items || [];
        CODEX.aliases = data.aliases || {};
        CODEX.index = buildSearchIndex(CODEX.items, CODEX.aliases);
        CODEX.byId = new Map(CODEX.items.map(i => [i.kind + ':' + i.id, i]));
        CODEX.loaded = true;
      })
      .catch(err => {
        CODEX.loading = null;   // 允许下次打开时重试
        const body = document.getElementById('codexBody');
        if (body) body.innerHTML = '<div class="codex-sub" style="padding:14px">图鉴数据加载失败，请重试</div>';
        throw err;
      });
  }
  return CODEX.loading;
}

// 只返回属性串，由调用方拼进标签（尺寸交给 .codex-icon 的 CSS）
function codexIconStyle(item, big) {
  return 'style="' + iconStyle(item.sheet, item.cell) + '" class="codex-icon' + (big ? ' lg' : '') + '"';
}

function codexItemHtml(item) {
  return '<div class="codex-item" data-kind="' + item.kind + '" data-id="' + item.id + '">' +
    '<div ' + codexIconStyle(item) + '></div>' +
    '<div class="codex-meta">' +
      '<div class="codex-name">' + esc(item.name) +
        (item.quality != null ? '<span class="codex-q">Q' + item.quality + '</span>' : '') + '</div>' +
      '<div class="codex-sub">' + esc(item.en || '') + (item.en ? ' · ' : '') + '#' + item.id + '</div>' +
    '</div>' +
  '</div>';
}

function codexFiltered() {
  const q = CODEX.query.trim();
  const pieces = CODEX.items.filter(i => i.kind === CODEX.kind);
  const qualityOn = CODEX.quality !== '' && (CODEX.kind === 'collectible' || CODEX.kind === 'trinket');
  const list = qualityOn ? pieces.filter(i => String(i.quality) === CODEX.quality) : pieces.slice();
  if (!q) return { exact: [], fuzzy: [], list };
  // 搜索时品质筛选同样生效：先按品质收窄候选，再精确/模糊匹配
  const allowed = new Set(list.map(i => i.kind + ':' + i.id));
  const sub = CODEX.index.filter(i => allowed.has(i.kind + ':' + i.id));
  const exact = searchExact(sub, q);
  const exKeys = new Set(exact.map(i => i.kind + ':' + i.id));
  const fuzzy = searchFuzzy(sub, q, exKeys);
  return { exact, fuzzy, list: [] };
}

function codexRender() {
  const body = document.getElementById('codexBody');
  const idxEl = document.getElementById('codexIndex');
  const titleEl = document.getElementById('codexSectionTitle');
  const qualityEl = document.getElementById('codexQuality');
  const q = CODEX.query.trim();
  CODEX.detail = false;
  qualityEl.style.display = (CODEX.kind === 'collectible' || CODEX.kind === 'trinket') ? '' : 'none';
  const { exact, fuzzy, list } = codexFiltered();
  idxEl.classList.toggle('show', CODEX.sort === 'letter' && !q);

  if (q) {
    titleEl.textContent = '精确查找 ' + exact.length + ' 条 · 模糊搜索 ' + fuzzy.length + ' 条';
    let html = '<div class="codex-section-title">精确查找</div>';
    html += exact.length ? exact.map(codexItemHtml).join('') : '<div class="codex-sub" style="padding:0 14px">无</div>';
    html += '<div class="codex-section-title">模糊搜索（点击图标查看详情）</div>';
    html += fuzzy.length
      ? '<div class="codex-grid">' + fuzzy.map(i =>
          '<div ' + codexIconStyle(i) + ' data-kind="' + i.kind + '" data-id="' + i.id + '" title="' + esc(i.name) + '"></div>'
        ).join('') + '</div>'
      : '<div class="codex-sub" style="padding:0 14px">无</div>';
    body.innerHTML = html;
    idxEl.innerHTML = '';
    return;
  }

  titleEl.textContent = CODEX_TABS.find(t => t.id === CODEX.kind).label + ' · 共 ' + list.length + ' 条';

  if (CODEX.sort === 'id') {
    list.sort((a, b) => b.id - a.id);   // filter 已产生新数组，不会改动 CODEX.items
    body.innerHTML = list.map(codexItemHtml).join('');
    idxEl.innerHTML = '';
    return;
  }

  // 首字母分组
  const groups = new Map();
  for (const it of list) {
    const ch = (it.ini || '#')[0].toUpperCase();
    const key = /[A-Z]/.test(ch) ? ch : (/\d/.test(ch) ? '0-9' : '#');
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }
  const order = ['0-9', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), '#'];
  let html = '';
  for (const k of order) {
    const g = groups.get(k);
    if (!g) continue;
    g.sort((a, b) => a.py.localeCompare(b.py) || a.id - b.id);
    html += '<div class="codex-group-h" id="cg-' + encodeURIComponent(k) + '">' + k + '（' + g.length + '）</div>';
    html += g.map(codexItemHtml).join('');
  }
  body.innerHTML = html;
  idxEl.innerHTML = order.filter(k => groups.has(k))
    .map(k => '<span data-k="' + k + '">' + k + '</span>').join('');
}

function codexOpenDetail(kind, id) {
  const item = CODEX.byId && CODEX.byId.get(kind + ':' + id);
  if (!item) return;
  const body = document.getElementById('codexBody');
  if (!CODEX.detail) CODEX.listScroll = body.scrollTop;   // 返回时恢复列表位置
  CODEX.detail = true;
  // pools 里可能混着字面量 "," 之类的占位 token，过滤掉
  const poolText = (item.pools || []).filter(p => /[A-Za-z0-9_一-鿿]/.test(p)).join('、');
  const pools = poolText ? '<p>道具池：' + esc(poolText) + '</p>' : '';
  const q = item.quality != null ? '<p>品质：' + '★'.repeat(item.quality) + '（Q' + item.quality + '）</p>' : '';
  const desc = item.desc ? '<p>' + esc(item.desc) + '</p>' : '<p>暂无摘要，可点击下方链接查看 wiki。</p>';
  body.innerHTML = '<div class="codex-detail">' +
    '<button class="codex-close" id="codexBack" aria-label="返回列表">←</button>' +
    '<div ' + codexIconStyle(item, true) + '></div>' +
    '<h3>' + esc(item.name) + '</h3>' +
    '<p class="codex-sub">' + esc(item.en || '') + (item.en ? ' · ' : '') + '#' + item.id + '</p>' +
    q + pools + desc +
    // 走 Task 9 的全局拦截：先保存现场再跳转；不要加 target
    '<p><a href="https://isaac.huijiwiki.com' + esc(item.wiki) + '" data-wiki="1">在 wiki 查看 →</a></p>' +
    '</div>';
  body.scrollTop = 0;
  document.getElementById('codexSectionTitle').textContent = item.name;
}

function codexViewState() {
  const b = document.getElementById('codexBody');
  // 详情页时列表已被替换，返回的是之前保存的列表位置
  const scrollTop = b ? (CODEX.detail ? (CODEX.listScroll || 0) : b.scrollTop) : 0;
  return { kind: CODEX.kind, sort: CODEX.sort, quality: CODEX.quality, query: CODEX.query, scrollTop };
}

function codexRestore(st) {
  if (!st) return;
  CODEX.kind = CODEX_TABS.some(t => t.id === st.kind) ? st.kind : 'collectible';
  CODEX.sort = st.sort === 'id' ? 'id' : 'letter';
  CODEX.quality = typeof st.quality === 'string' ? st.quality : '';
  CODEX.query = typeof st.query === 'string' ? st.query : '';
  const overlay = document.getElementById('codexOverlay');
  overlay.classList.add('open');
  // 这里直接加 .open，不经过 codexOpen，需自行锁页面滚动
  document.body.style.overflow = 'hidden';
  const body = document.getElementById('codexBody');
  if (!CODEX.loaded && body) body.textContent = '加载中…';
  codexLoad().then(() => {
    const search = document.getElementById('codexSearch');
    if (search) search.value = CODEX.query;
    const sortSel = document.getElementById('codexSort');
    if (sortSel) sortSel.value = CODEX.sort;
    document.querySelectorAll('#codexQuality button')
      .forEach(b => b.classList.toggle('active', b.dataset.q === CODEX.quality));
    document.querySelectorAll('.codex-tab')
      .forEach(b => b.classList.toggle('active', b.dataset.kind === CODEX.kind));
    codexRender();
    if (body) body.scrollTop = st.scrollTop || 0;
  }).catch(() => {});
}

function codexOpen() {
  const overlay = document.getElementById('codexOverlay');
  if (!overlay) return;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
  const body = document.getElementById('codexBody');
  if (!CODEX.loaded && body) body.textContent = '加载中…';
  codexLoad().then(() => {
    codexRender();
    if (body) body.scrollTop = CODEX.scrollTop || 0;
  }).catch(() => {});
}

function codexClose() {
  const body = document.getElementById('codexBody');
  if (body && !CODEX.detail) CODEX.scrollTop = body.scrollTop;
  const overlay = document.getElementById('codexOverlay');
  if (overlay) overlay.classList.remove('open');
  document.body.style.overflow = '';
}

function codexInit() {
  const tabs = document.getElementById('codexTabs');
  const fab = document.getElementById('codexFab');
  const overlay = document.getElementById('codexOverlay');
  const body = document.getElementById('codexBody');
  const idxEl = document.getElementById('codexIndex');
  if (!tabs || !fab || !overlay || !body || !idxEl) return;

  tabs.innerHTML = CODEX_TABS.map(t =>
    '<button class="codex-tab' + (t.id === CODEX.kind ? ' active' : '') + '" data-kind="' + t.id + '">' + t.label + '</button>'
  ).join('');

  tabs.addEventListener('click', (e) => {
    const b = e.target.closest('.codex-tab');
    if (!b) return;
    CODEX.kind = b.dataset.kind;
    tabs.querySelectorAll('.codex-tab').forEach(x => x.classList.toggle('active', x === b));
    codexRender();
    body.scrollTop = 0;
  });

  document.getElementById('codexSearch').addEventListener('input', (e) => {
    CODEX.query = e.target.value;
    codexRender();
  });
  document.getElementById('codexSort').addEventListener('change', (e) => {
    CODEX.sort = e.target.value;
    codexRender();
  });
  document.getElementById('codexQuality').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    CODEX.quality = b.dataset.q;
    document.querySelectorAll('#codexQuality button').forEach(x => x.classList.toggle('active', x === b));
    codexRender();
  });
  document.getElementById('codexClose').addEventListener('click', codexClose);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) codexClose(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && codexIsOpen()) codexClose();
  });

  body.addEventListener('click', (e) => {
    if (e.target.closest('#codexBack')) {
      CODEX.detail = false;
      codexRender();
      body.scrollTop = CODEX.listScroll || 0;
      return;
    }
    const el = e.target.closest('[data-kind][data-id]');
    if (!el) return;
    codexOpenDetail(el.dataset.kind, +el.dataset.id);
  });

  idxEl.addEventListener('click', (e) => {
    const sp = e.target.closest('span');
    if (!sp) return;
    const h = document.getElementById('cg-' + encodeURIComponent(sp.dataset.k));
    if (!h) return;
    // 用 body.scrollTo 而不是 scrollIntoView：后者会把下层的页面也一起滚动
    const top = h.getBoundingClientRect().top - body.getBoundingClientRect().top + body.scrollTop;
    body.scrollTo({ top, behavior: 'smooth' });
  });

  // 滚动时高亮当前首字母（分组头相对 body 的偏移）
  let scrollRaf = 0;
  body.addEventListener('scroll', () => {
    if (CODEX.sort !== 'letter' || CODEX.query.trim() || CODEX.detail) return;
    if (scrollRaf) return;
    scrollRaf = requestAnimationFrame(() => {
      scrollRaf = 0;
      const heads = Array.from(body.querySelectorAll('.codex-group-h'));
      let active = '';
      for (const h of heads) {
        if (h.offsetTop - body.scrollTop <= 8) active = decodeURIComponent(h.id.slice(3));
      }
      idxEl.querySelectorAll('span').forEach(s => s.classList.toggle('active', s.dataset.k === active));
    });
  });

  // 悬浮按钮：拖动（位置存 localStorage），轻点打开图鉴
  let drag = null;
  fab.addEventListener('pointerdown', (e) => {
    if (e.button != null && e.button !== 0) return;
    try { fab.setPointerCapture(e.pointerId); } catch (err) {}
    drag = { x: e.clientX, y: e.clientY, moved: false };
  });
  fab.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
    if (!drag.moved) return;
    const rect = fab.getBoundingClientRect();
    const w = fab.offsetWidth, h = fab.offsetHeight;
    const left = Math.max(4, Math.min(window.innerWidth - w - 4, rect.left + dx));
    const top = Math.max(60, Math.min(window.innerHeight - h - 8, rect.top + dy));
    fab.style.left = left + 'px';
    fab.style.top = top + 'px';
    fab.style.right = 'auto';
    fab.style.bottom = 'auto';
    drag.x = e.clientX;
    drag.y = e.clientY;
  });
  fab.addEventListener('pointerup', () => {
    const moved = !!(drag && drag.moved);
    drag = null;
    if (!moved) { codexOpen(); return; }
    try {
      localStorage.setItem('isaac_codex_fab', JSON.stringify({
        left: parseFloat(fab.style.left) || 0,
        top: parseFloat(fab.style.top) || 0,
      }));
    } catch (err) {}
  });
  // 触摸被系统打断（来电/手势）时不残留拖动状态，也不误触发打开
  fab.addEventListener('pointercancel', () => { drag = null; });
  // 键盘激活（Enter/空格）产生的 click 不带指针，detail 为 0
  fab.addEventListener('click', (e) => { if (e.detail === 0) codexOpen(); });

  try {
    const saved = JSON.parse(localStorage.getItem('isaac_codex_fab') || 'null');
    if (saved && Number.isFinite(saved.left) && Number.isFinite(saved.top)) {
      const w = fab.offsetWidth || 58, h = fab.offsetHeight || 58;
      fab.style.left = Math.max(4, Math.min(window.innerWidth - w - 4, saved.left)) + 'px';
      fab.style.top = Math.max(60, Math.min(window.innerHeight - h - 8, saved.top)) + 'px';
      fab.style.right = 'auto';
      fab.style.bottom = 'auto';
    }
  } catch (err) {}
}

/* ---------- 初始化 ---------- */
initTheme();
load();
// 用户提供的自定义图标（按成就标题匹配），作为默认图标（可被用户再次上传覆盖）
applyUserIcons();
generateWikiIcons();
codexInit();
renderTabs();
renderAll();
updateDoneClasses();
updateProgress();
applyFilter();

/* ---------- PWA 安装支持（离线缓存，可添加到主屏幕） ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
